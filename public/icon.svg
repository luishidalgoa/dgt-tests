<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado con gradiente -->
  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>

  <!-- Disco blanco exterior (luego carvamos para crear el efecto volante) -->
  <circle cx="512" cy="512" r="320" fill="#ffffff"/>

  <!-- Mitad superior interior: la "carvamos" pintando el fondo encima.
       Esto crea: aro blanco completo + mitad inferior llena + mitad superior hueca.
       sweep=1 → el arco va por la MITAD SUPERIOR (la que vamos a carvar). -->
  <path d="M 272 512 A 240 240 0 0 1 752 512 Z" fill="url(#bg)"/>

  <!-- Spoke superior: rectángulo blanco vertical desde el aro al hub.
       Sobreescribe parte del fondo recién pintado en la mitad superior. -->
  <rect x="478" y="272" width="68" height="240" rx="34" fill="#ffffff"/>

  <!-- Hub central blanco -->
  <circle cx="512" cy="512" r="84" fill="#ffffff"/>

  <!-- Detalle: punto del color del fondo en el centro del hub -->
  <circle cx="512" cy="512" r="30" fill="url(#bg)"/>
</svg>
