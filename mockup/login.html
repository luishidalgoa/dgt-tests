<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DGT Tests — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing: border-box; }
  :root{
    --orange-500:#f97316;
    --orange-600:#ea580c;
    --red-600:#dc2626;
    --red-500:#ef4444;
    --slate-900:#0f172a;
    --slate-700:#334155;
    --slate-500:#64748b;
    --slate-400:#94a3b8;
    --slate-300:#cbd5e1;
    --slate-200:#e2e8f0;
    --slate-100:#f1f5f9;
  }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family:'Inter', system-ui, sans-serif;
    color:var(--slate-900);
    min-height:100vh;
    background:
      linear-gradient(135deg, #f97316 0%, #dc2626 100%);
    position:relative;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* Diagonal lane markings overlay (10% opacity) */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: repeating-linear-gradient(
      135deg,
      transparent 0,
      transparent 60px,
      rgba(255,255,255,.10) 60px,
      rgba(255,255,255,.10) 64px,
      transparent 64px,
      transparent 120px,
      rgba(255,255,255,.06) 120px,
      rgba(255,255,255,.06) 122px
    );
    pointer-events:none;
    z-index:0;
  }

  /* Soft glow blobs to add depth */
  body::after{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(600px 400px at 12% 18%, rgba(255,237,213,.35), transparent 60%),
      radial-gradient(700px 500px at 88% 92%, rgba(127,29,29,.35), transparent 60%);
    pointer-events:none;
    z-index:0;
  }

  .page{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
  }

  /* Glassmorphism card */
  .card{
    width:100%;
    max-width:420px;
    min-height:580px;
    background:rgba(255,255,255,.72);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    border:1px solid rgba(255,255,255,.55);
    border-radius:24px;
    padding:40px 36px 32px;
    box-shadow:
      0 30px 60px -20px rgba(220,38,38,.45),
      0 18px 32px -16px rgba(249,115,22,.45),
      inset 0 1px 0 rgba(255,255,255,.6);
    animation: cardIn .7s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes cardIn{
    from{ transform:translateY(14px) scale(.985); opacity:0; }
    to{ transform:translateY(0) scale(1); opacity:1; }
  }

  .car{
    font-size:54px;
    text-align:center;
    line-height:1;
    margin-bottom:14px;
    filter: drop-shadow(0 8px 14px rgba(220,38,38,.25));
    animation: bobble 3.6s ease-in-out infinite;
  }
  @keyframes bobble{
    0%,100%{ transform:translateY(0) rotate(-2deg);}
    50%{ transform:translateY(-4px) rotate(2deg);}
  }

  h1{
    font-size:32px;
    font-weight:800;
    margin:0 0 6px;
    text-align:center;
    letter-spacing:-0.02em;
    color:#0a0a0a;
  }
  .sub{
    font-size:14px;
    color:var(--slate-500);
    text-align:center;
    margin:0 0 28px;
    font-weight:500;
  }

  label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--slate-700);
    margin:0 4px 6px;
    letter-spacing:.02em;
  }

  .field{
    position:relative;
    margin-bottom:16px;
  }
  .field input{
    width:100%;
    height:52px;
    padding:0 16px 0 46px;
    border-radius:14px;
    border:1.5px solid var(--slate-200);
    background:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:500;
    color:var(--slate-900);
    outline:none;
    transition:border-color .15s, box-shadow .15s, transform .15s;
  }
  .field input::placeholder{ color:var(--slate-400); font-weight:500; }
  .field input:focus{
    border-color:var(--orange-500);
    box-shadow:0 0 0 4px rgba(249,115,22,.18);
  }
  .field .ico{
    position:absolute;
    left:14px; top:50%;
    transform:translateY(-50%);
    color:var(--slate-400);
    pointer-events:none;
  }
  .field .eye{
    position:absolute;
    right:12px; top:50%;
    transform:translateY(-50%);
    color:var(--slate-400);
    background:transparent;
    border:0;
    padding:6px;
    border-radius:8px;
    cursor:pointer;
  }
  .field .eye:hover{ color:var(--orange-600); background:rgba(249,115,22,.08); }

  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:6px 2px 22px;
  }
  .remember{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13.5px;
    color:var(--slate-700);
    font-weight:500;
    cursor:pointer;
    user-select:none;
  }
  .remember input{ display:none; }
  .check{
    width:20px; height:20px;
    border-radius:6px;
    background:linear-gradient(180deg, var(--orange-500), var(--orange-600));
    display:inline-flex;
    align-items:center; justify-content:center;
    box-shadow:0 4px 10px -2px rgba(249,115,22,.55);
    flex-shrink:0;
  }
  .check svg{ color:#fff; }
  .remember input:not(:checked) + .check{
    background:#fff;
    border:1.5px solid var(--slate-300);
    box-shadow:none;
  }
  .remember input:not(:checked) + .check svg{ display:none; }
  .forgot{
    font-size:12.5px;
    color:var(--slate-500);
    text-decoration:none;
    font-weight:600;
  }
  .forgot:hover{ color:var(--orange-600); }

  .cta{
    width:100%;
    height:58px;
    border:0;
    border-radius:16px;
    background:linear-gradient(180deg, #fb923c 0%, #f97316 45%, #dc2626 100%);
    color:#fff;
    font-family:inherit;
    font-weight:800;
    font-size:16px;
    letter-spacing:.08em;
    text-transform:uppercase;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    box-shadow:
      0 16px 32px -10px rgba(220,38,38,.55),
      0 6px 14px -6px rgba(249,115,22,.6),
      inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .15s, box-shadow .15s, filter .15s;
    position:relative;
    overflow:hidden;
  }
  .cta::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%);
    transform:translateX(-100%);
    transition:transform .8s;
  }
  .cta:hover{ transform:translateY(-1px); filter:brightness(1.05); }
  .cta:hover::after{ transform:translateX(100%); }
  .cta:active{ transform:translateY(1px); }

  .divider{
    display:flex; align-items:center;
    gap:12px;
    margin:24px 0 14px;
    color:var(--slate-400);
    font-size:12.5px;
    font-weight:500;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--slate-200), transparent);
  }

  .signup{
    display:block;
    text-align:center;
    color:var(--orange-600);
    font-weight:700;
    font-size:14.5px;
    text-decoration:none;
    padding:8px;
    border-radius:10px;
    transition:background .15s, color .15s;
  }
  .signup:hover{
    background:rgba(249,115,22,.08);
    color:var(--red-600);
  }

  /* tiny decorative footer */
  .corner{
    position:fixed;
    bottom:16px;
    left:0; right:0;
    text-align:center;
    color:rgba(255,255,255,.7);
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    z-index:1;
  }
</style>
</head>
<body>
  <main class="page">
    <section class="card" role="dialog" aria-labelledby="title">
      <div class="car" aria-hidden="true">🚗</div>
      <h1 id="title">¡Hola, conductor!</h1>
      <p class="sub">Prepárate para aprobar a la primera</p>

      <label for="user">Usuario</label>
      <div class="field">
        <span class="ico" aria-hidden="true">
          <!-- person -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <input id="user" type="text" autocomplete="username" placeholder="tu_usuario o email">
      </div>

      <label for="pass">Contraseña</label>
      <div class="field">
        <span class="ico" aria-hidden="true">
          <!-- lock -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••••">
        <button class="eye" type="button" aria-label="Mostrar contraseña" onclick="(function(b){var i=document.getElementById('pass'); i.type=i.type==='password'?'text':'password';})(this)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="row">
        <label class="remember">
          <input type="checkbox" checked>
          <span class="check" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
          Recordarme en este dispositivo
        </label>
        <a class="forgot" href="#">¿Olvidaste?</a>
      </div>

      <button class="cta" type="submit">
        <span>🚦</span> Arrancar
      </button>

      <div class="divider">o si eres nuevo</div>

      <a class="signup" href="#">Crea tu cuenta gratis →</a>
    </section>
  </main>

  <div class="corner">DGT TESTS · APRUEBA A LA PRIMERA</div>
</body>
</html>
